name: Import GAME ON source archive
on:
  push:
    paths:
      - '.gameon-import/source-part-*'
permissions:
  contents: write
jobs:
  extract:
    if: github.ref == 'refs/heads/import/game-on-mvp-0.9.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore and validate project source
        shell: bash
        run: |
          set -euo pipefail
          cat .gameon-import/source-part-* > /tmp/game-on-source.b64
          base64 --decode /tmp/game-on-source.b64 > /tmp/game-on-source.tar.xz
          tar -tJf /tmp/game-on-source.tar.xz > /tmp/game-on-paths.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/game-on-paths.txt; then
            echo "Unsafe path in archive" >&2
            exit 1
          fi
          tar -xJf /tmp/game-on-source.tar.xz -C .
          rm -rf .gameon-import
          rm -f .github/workflows/import-gameon-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import GAME ON Store and Creator source 0.9.10"
          git push --force origin "HEAD:${GITHUB_REF_NAME}"
