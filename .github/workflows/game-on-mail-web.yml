name: GAME ON MAIL web checks

on:
  push:
    branches:
      - game-on-mail-phase-1
    paths:
      - "game-on-mail/web/**"
      - ".github/workflows/game-on-mail-web.yml"
  pull_request:
    paths:
      - "game-on-mail/web/**"
      - ".github/workflows/game-on-mail-web.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-on-mail/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
