name: GAME ON MAIL web checks

on:
  workflow_dispatch:
  push:
    branches:
      - game-on-mail-phase-1
    paths:
      - "game-on-mail/web/**"
      - ".github/workflows/game-on-mail-web.yml"
  pull_request:
    paths:
      - "game-on-mail/web/**"
      - ".github/workflows/game-on-mail-web.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, production build and database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: gameon_mail_ci
          POSTGRES_USER: gameon_mail_ci
          POSTGRES_PASSWORD: gameon-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameon_mail_ci -d gameon_mail_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: game-on-mail/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database migration
        env:
          PGPASSWORD: gameon-ci-only-password
        run: psql -h 127.0.0.1 -U gameon_mail_ci -d gameon_mail_ci -v ON_ERROR_STOP=1 -f ../database/migrations/0001_initial_schema.sql
      - name: Build
        run: npm run build
