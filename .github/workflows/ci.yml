name: GAME ON validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies and generate genuine lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Run strict release configuration preflight
        run: npm run release:preflight
      - name: Upload generated root lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: game-on-root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply all Supabase migrations
        run: supabase db reset
      - name: Run pgTAP database security tests
        run: supabase test db
      - name: Run automated safety and source tests
        run: npm test
      - name: Type-check both apps
        run: npm run typecheck
      - name: Build both apps
        run: npm run build
