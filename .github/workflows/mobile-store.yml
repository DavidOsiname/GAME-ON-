name: GAME ON STORE mobile

on:
  push:
    branches:
      - mobile/store-native-foundation
    paths:
      - "mobile/store/**"
      - ".github/workflows/mobile-store.yml"
  pull_request:
    paths:
      - "mobile/store/**"
      - ".github/workflows/mobile-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/store
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/store/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Run Expo project diagnostics
        run: npx expo-doctor
      - name: Bundle GAME ON STORE for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir dist
